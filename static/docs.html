<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQDRate API Documentation</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .endpoint-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        .endpoint-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .method-badge {
            background: var(--accent);
            color: #000;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .method-badge.post { background: #4da6ff; color: #000; }
        .method-badge.delete { background: #ff4d4d; color: #000; }
        .method-badge.put { background: #ffb84d; color: #000; }
        
        .endpoint-path {
            font-family: monospace;
            font-size: 1.2rem;
            color: #fff;
            word-break: break-all;
        }
        .endpoint-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        
        /* Playground Area */
        .playground-area {
            background: rgba(0,0,0,0.4);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1.5rem;
        }
        .playground-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid #333;
            padding-bottom: 0.5rem;
        }
        .playground-header h4 {
            color: var(--accent);
            margin: 0;
            font-size: 1rem;
        }
        
        .input-group {
            margin-bottom: 1rem;
        }
        .input-group label {
            display: block;
            color: #ccc;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
        }
        .playground-input {
            width: 100%;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            box-sizing: border-box;
        }
        .playground-input:focus {
            border-color: var(--accent);
            outline: none;
        }
        
        .run-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .run-btn:hover {
            box-shadow: 0 0 15px rgba(226, 254, 83, 0.4);
        }
        .run-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .response-output {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            display: none;
        }
        .response-output pre {
            margin: 0;
            font-family: monospace;
            font-size: 0.9rem;
            color: #a3ff47;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .status-200 { background: rgba(226, 254, 83, 0.2); color: var(--accent); }
        .status-error { background: rgba(255, 77, 77, 0.2); color: #ff4d4d; }

        .global-auth {
            background: #111;
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        /* Schemas */
        .schema-card {
            background: rgba(255,255,255,0.01);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .schema-title {
            color: #fff;
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 1rem;
            border-bottom: 1px solid #333;
            padding-bottom: 0.5rem;
        }
        .schema-prop {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #333;
            padding: 0.5rem 0;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .schema-prop:last-child {
            border-bottom: none;
        }
        .prop-name { color: #fff; font-weight: bold; }
        .prop-type { color: var(--accent); }
    </style>
</head>
<body>

    <div class="container" style="max-width: 900px; padding-top: 1rem; padding-bottom: 4rem;">
        
        <!-- Navbar -->
        <nav style="margin-bottom: 3rem;">
            <div class="brand">
                <div class="brand-dot"></div>
                IQDRate <span style="font-weight: 400; color: var(--text-secondary); margin-left: 0.5rem; font-size: 1rem;">API Docs</span>
            </div>
            <div class="nav-links" style="display: flex; gap: 1.5rem;">
                <a href="/">Home</a>
                <a href="/status">Status</a>
                <a href="/developers">Get API Key</a>
            </div>
        </nav>

        <!-- Hero Section -->
        <div class="glass-card text-center" style="padding: 3rem 2rem; margin-bottom: 2rem;">
            <h1 id="api-title" style="font-size: 2.5rem; margin-bottom: 1rem; color: #fff;">Loading API...</h1>
            <p id="api-desc" style="color: var(--text-secondary); max-width: 600px; margin: 0 auto; font-size: 1.1rem; line-height: 1.6;">
                Fetching real-time backend specifications...
            </p>
        </div>

        <!-- Global Auth Section -->
        <div class="global-auth" id="auth-section">
            <h3 style="color: #fff; margin-top: 0; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between;">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    Global Authorization
                </span>
                <span id="key-status-badge" style="font-size: 0.85rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; display: none;"></span>
            </h3>
            <p style="color: #aaa; margin-bottom: 1rem; font-size: 0.95rem;">Paste your Bearer Token here. It will be automatically used for all Playground tests below.</p>
            
            <div style="display: flex; gap: 1rem; align-items: center;">
                <input type="text" id="global-api-key" class="playground-input" placeholder="er_live_xxxxxxxxxxxxxxxxxxxxxx" style="border-color: rgba(226, 254, 83, 0.5); flex: 1; transition: all 0.3s;">
                <a href="/developers#generate-section" class="run-btn" style="text-decoration: none; background: #333; color: #fff; white-space: nowrap;">
                    Get API Key &rarr;
                </a>
            </div>
        </div>

        <h2 style="color: #fff; margin-bottom: 1.5rem;">Endpoints</h2>
        
        <div id="endpoints-container">
            <!-- Dynamically generated endpoints go here -->
        </div>

        <h2 style="color: #fff; margin-top: 4rem; margin-bottom: 1.5rem;">Data Schemas</h2>
        <div id="schemas-container">
            <!-- Dynamically generated schemas go here -->
        </div>

    </div>

    <script>
        // Auto-verify API Key
        const apiKeyInput = document.getElementById('global-api-key');
        const statusBadge = document.getElementById('key-status-badge');

        apiKeyInput.addEventListener('input', async (e) => {
            const key = e.target.value.trim();
            apiKeyInput.style.borderColor = 'rgba(226, 254, 83, 0.5)'; // Reset border
            
            if (key.length < 5) {
                statusBadge.style.display = 'none';
                return;
            }

            // Show verifying state
            statusBadge.style.display = 'inline-block';
            statusBadge.style.background = '#333';
            statusBadge.style.color = '#fff';
            statusBadge.textContent = 'Verifying...';

            try {
                const res = await fetch('/api/me', {
                    headers: { 'Authorization': 'Bearer ' + key }
                });
                const data = await res.json();

                // Check tier field (not user_id) — guests get tier:'guest'
                if (res.ok && data.tier && data.tier !== 'guest') {
                    statusBadge.style.background = 'rgba(226, 254, 83, 0.2)';
                    statusBadge.style.color = 'var(--accent)';
                    statusBadge.textContent = `✓ Valid · ${data.remaining?.toLocaleString() ?? '?'} tokens left`;
                    apiKeyInput.style.borderColor = 'var(--accent)';
                } else {
                    statusBadge.style.background = 'rgba(255, 77, 77, 0.2)';
                    statusBadge.style.color = '#ff4d4d';
                    statusBadge.textContent = 'Invalid Key';
                    apiKeyInput.style.borderColor = '#ff4d4d';
                }
            } catch (err) {
                statusBadge.style.background = 'rgba(255, 77, 77, 0.2)';
                statusBadge.style.color = '#ff4d4d';
                statusBadge.textContent = 'Network Error';
            }
        });

        // Core Engine to parse OpenAPI spec and render UI dynamically
        async function fetchAndRenderAPI() {
            try {
                // Fetch the OpenAPI spec directly from FastAPI
                const res = await fetch('/openapi.json');
                if (!res.ok) throw new Error("Failed to load openapi.json");
                const spec = await res.json();

                // 1. Setup Header Info
                document.getElementById('api-title').textContent = spec.info.title;
                document.getElementById('api-desc').textContent = spec.info.description || 'Interactive API Reference';

                // 2. Render Endpoints
                const endpointsContainer = document.getElementById('endpoints-container');
                endpointsContainer.innerHTML = ''; // Clear loading state
                
                for (const [path, methods] of Object.entries(spec.paths)) {
                    for (const [method, details] of Object.entries(methods)) {
                        renderEndpoint(endpointsContainer, path, method, details);
                    }
                }

                // 3. Render Schemas
                const schemasContainer = document.getElementById('schemas-container');
                schemasContainer.innerHTML = '';
                if (spec.components && spec.components.schemas) {
                    for (const [schemaName, schemaDetails] of Object.entries(spec.components.schemas)) {
                        renderSchema(schemasContainer, schemaName, schemaDetails);
                    }
                }

            } catch (err) {
                console.error(err);
                document.getElementById('api-title').textContent = "Error Loading API";
                document.getElementById('api-desc').textContent = "Could not connect to the backend to fetch openapi.json.";
            }
        }

        function renderEndpoint(container, path, method, details) {
            const isProtected = path.includes('/admin') || details.summary?.toLowerCase().includes('admin');
            
            // Build parameter inputs HTML
            let inputsHtml = '';
            if (details.parameters) {
                details.parameters.forEach(param => {
                    inputsHtml += `
                        <div class="input-group">
                            <label>${param.name} (${param.in}) ${param.required ? '*' : ''}</label>
                            <input type="text" class="playground-input param-input" data-param="${param.name}" data-in="${param.in}" placeholder="Type ${param.schema?.type || 'string'}">
                        </div>
                    `;
                });
            }

            // Path params extraction for URL building
            const hasPathParams = path.includes('{');

            let playgroundHtml = `
                <div class="playground-area" ${isProtected ? 'style="opacity:0.5; pointer-events:none;"' : ''}>
                    <div class="playground-header">
                        <h4>▶ Try It Live</h4>
                        ${isProtected ? '<span style="color:#ff4d4d; font-size:0.8rem;">Admin UI Only</span>' : ''}
                    </div>
                    ${inputsHtml}
                    <button class="run-btn" onclick="runDynamicTest(this, '${method.toUpperCase()}', '${path}')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Run Request
                    </button>
                    <div class="response-output">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
                            <div class="status-badge"></div>
                            <div style="display:flex;gap:0.75rem;align-items:center;">
                                <span class="latency-label" style="font-size:0.75rem;color:#64748b;"></span>
                                <button class="copy-btn" onclick="copyResponse(this)" style="background:rgba(255,255,255,0.07);border:1px solid #333;color:#aaa;padding:3px 10px;border-radius:5px;cursor:pointer;font-size:0.75rem;">Copy</button>
                            </div>
                        </div>
                        <pre></pre>
                    </div>
                </div>
            `;

            const cardHtml = `
                <div class="endpoint-card">
                    <div class="endpoint-header">
                        <span class="method-badge ${method.toLowerCase()}">${method.toUpperCase()}</span>
                        <span class="endpoint-path">${path}</span>
                    </div>
                    <p class="endpoint-desc">${details.summary || ''}<br><br>${details.description || ''}</p>
                    ${playgroundHtml}
                </div>
            `;

            container.insertAdjacentHTML('beforeend', cardHtml);
        }

        function renderSchema(container, name, details) {
            let propsHtml = '';
            if (details.properties) {
                for (const [propName, propDef] of Object.entries(details.properties)) {
                    let typeStr = propDef.type || 'object';
                    if (propDef.anyOf) typeStr = 'mixed';
                    if (propDef.$ref) typeStr = propDef.$ref.split('/').pop();
                    
                    propsHtml += `
                        <div class="schema-prop">
                            <span class="prop-name">${propName}</span>
                            <span class="prop-type">${typeStr}</span>
                        </div>
                    `;
                }
            } else {
                propsHtml = `<div class="schema-prop"><span class="prop-name">No properties defined</span></div>`;
            }

            const schemaHtml = `
                <div class="schema-card">
                    <h4 class="schema-title">${name}</h4>
                    ${propsHtml}
                </div>
            `;
            container.insertAdjacentHTML('beforeend', schemaHtml);
        }

        async function runDynamicTest(btn, method, pathPattern) {
            const apiKey = document.getElementById('global-api-key').value.trim();
            const authSection = document.getElementById('auth-section');
            const apiKeyInputEl = document.getElementById('global-api-key');
            
            // Block if empty API key
            if (!apiKey) {
                // Scroll to the auth box
                window.scrollTo({
                    top: authSection.offsetTop - 100,
                    behavior: 'smooth'
                });
                
                // Shake and flash red
                apiKeyInputEl.style.transition = 'all 0.1s';
                apiKeyInputEl.style.borderColor = '#ff4d4d';
                apiKeyInputEl.style.transform = 'translateX(-10px)';
                setTimeout(() => apiKeyInputEl.style.transform = 'translateX(10px)', 100);
                setTimeout(() => apiKeyInputEl.style.transform = 'translateX(-10px)', 200);
                setTimeout(() => apiKeyInputEl.style.transform = 'translateX(10px)', 300);
                setTimeout(() => {
                    apiKeyInputEl.style.transform = 'translateX(0)';
                    apiKeyInputEl.focus();
                }, 400);
                
                return; // Stop the function completely
            }

            const playgroundArea = btn.closest('.playground-area');
            const outputDiv = playgroundArea.querySelector('.response-output');
            const statusBadge = outputDiv.querySelector('.status-badge');
            const pre = outputDiv.querySelector('pre');
            
            // Build dynamic URL
            let finalUrl = pathPattern;
            const paramInputs = playgroundArea.querySelectorAll('.param-input');
            const queryParams = new URLSearchParams();

            paramInputs.forEach(input => {
                if (input.value) {
                    if (input.dataset.in === 'path') {
                        finalUrl = finalUrl.replace(`{${input.dataset.param}}`, encodeURIComponent(input.value));
                    } else if (input.dataset.in === 'query') {
                        queryParams.append(input.dataset.param, input.value);
                    }
                }
            });

            if (queryParams.toString()) {
                finalUrl += '?' + queryParams.toString();
            }

            // Ensure host
            if (!finalUrl.startsWith('http')) {
                finalUrl = window.location.origin + finalUrl;
            }

            // UI Update
            btn.disabled = true;
            btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>Running...</span>';
            outputDiv.style.display = 'block';
            statusBadge.className = 'status-badge';
            statusBadge.textContent = 'Fetching...';
            pre.textContent = '';
            const latencyEl = playgroundArea.querySelector('.latency-label');
            if (latencyEl) latencyEl.textContent = '';

            const t0 = performance.now();
            try {
                const headers = { 'Authorization': 'Bearer ' + apiKey };
                const response = await fetch(finalUrl, { method, headers });
                const latency = Math.round(performance.now() - t0);
                const data = await response.json().catch(() => ({ error: 'Response is not JSON' }));

                statusBadge.textContent = `${response.status} ${response.statusText}`;
                statusBadge.className = `status-badge ${response.ok ? 'status-200' : 'status-error'}`;
                if (latencyEl) latencyEl.textContent = `${latency}ms`;
                pre.textContent = JSON.stringify(data, null, 2);

            } catch (err) {
                statusBadge.textContent = 'Network Error';
                statusBadge.className = 'status-badge status-error';
                pre.textContent = err.toString();
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> Run Request';
            }
        }

        function copyResponse(btn) {
            const pre = btn.closest('.response-output').querySelector('pre');
            if (!pre.textContent) return;
            navigator.clipboard.writeText(pre.textContent).then(() => {
                btn.textContent = 'Copied!';
                btn.style.color = 'var(--accent)';
                setTimeout(() => { btn.textContent = 'Copy'; btn.style.color = '#aaa'; }, 1500);
            });
        }

        // Initialize Engine on load
        window.addEventListener('DOMContentLoaded', fetchAndRenderAPI);
    </script>
</body>
</html>
